<script type="module">
import * as THREE from 'three';

/* =====================================================================
 * 1. 定数 (チューニングパラメータ)
 * ===================================================================== */
const C = Object.freeze({
  DT: 1 / 120, MAX_STEPS: 10,              // 固定タイムステップ
  G: 9.81,
  LAG_ATT: 0.12, LAG_YAW: 0.15, LAG_THRUST: 0.06, LAG_MOTOR: 0.05, // 一次遅れ時定数 [s]
  MAX_TILT: 30 * Math.PI / 180,
  DRAG_LIN: 0.30, DRAG_QUAD: 0.06,
  TAKEOFF_ALT: 1.2, SPOOL_UP: 0.9, SPOOL_DOWN: 1.2,
  RADIUS: 0.2, RESTITUTION: 0.3, CEIL_CLEAR: 0.12, BODY_CENTER: 0.07,
  AUTO_VMAX: 1.2, AUTO_VY_MAX: 0.6, SURF_CLEAR: 0.3,
  HEAD_CLEAR: 0.9, HEAD_GAIN: 4.0,        // AUTO: 頭からこの距離以内で反発 [m] / 反発ゲイン
  WALL_RECOVER: 1.0,                       // 壁の裏側へ出てしまった場合、この距離までは部屋側へ戻す [m]
  SHADOW_DEPTH_BIAS: 0.04,                 // 深度オクルージョン有効時、影を床の深度ノイズより手前に描くバイアス [m]
  MAN_V: 1.6, MAN_VY: 1.0, MAN_YAW: 1.8, DEADZONE: 0.12, EXPO: 0.6,
  RPM_HOVER: 9000, RPM_VISUAL_MAX: 700,
  RECALL_DIST: 1.0, RECALL_VMAX: 1.6,
  BOX_X: 3, BOX_Y: 2, BOX_Z: 3,            // 平面が無い場合の部屋
  HUD_HZ: 5, AUTO_TAKEOFF_DELAY: 4,
  ROOM_REFRESH: 1.0,
  FPV_HZ: 30,                              // ドローン視点モニターの更新頻度 [Hz]
  FPV_FOV: 95, FPV_DOWN_DEG: 8,            // FPVカメラの画角 [deg] / 固定の下向き角 [deg]
  FPV_TILT_FOLLOW: 0.35,                   // 機体の実ピッチ/ロールをFPV映像へ混ぜる割合 (0=水平固定, 1=機体と同じ)
  FPV_RT_W: 512, FPV_RT_H: 288,            // モニター用レンダーターゲット解像度
  MON_W: 0.18,                             // モニター画面の幅 [m] (高さは16:9)
  MON_GRID: 0.5,                           // 部屋モデルのグリッド間隔 [m]
});

/* =====================================================================
 * 2. ユーティリティ
 * ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const smoothstep = (x, a, b) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angleDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const rand = (a, b) => a + Math.random() * (b - a);

/** 単純なPID (積分クランプ付き)。de は外部から微分項(誤差の変化率)を渡す。 */
class PID {
  constructor(kp, ki, kd, imax) { this.kp = kp; this.ki = ki; this.kd = kd; this.imax = imax; this.i = 0; }
  reset() { this.i = 0; }
  step(e, de, dt) {
    this.i = clamp(this.i + e * dt, -this.imax, this.imax);
    return this.kp * e + this.ki * this.i + this.kd * de;
  }
}

/* =====================================================================
 * 3. ドローンモデル (全て手続き生成)  原点=スキッド底面、機首=-Z
 * ===================================================================== */
function createDrone() {
  const g = new THREE.Group();
  g.name = 'drone';
  const std = (color, metalness, roughness, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, metalness, roughness }, extra));
  const mShell = std(0xe4e7ec, 0.35, 0.38);
  const mDark = std(0x1d2025, 0.5, 0.5);
  const mArm = std(0x2b2f36, 0.6, 0.45);
  const mMotor = std(0x9aa2ad, 0.55, 0.35);   // 環境マップ無しでも黒潰れしない程度の金属感
  const mSkid = std(0x15171b, 0.3, 0.6);
  const mLens = std(0x05070a, 0.9, 0.1);
  const mLedF = std(0x113311, 0, 0.5, { emissive: 0x22ff55, emissiveIntensity: 2.0 });
  const mLedR = std(0x331111, 0, 0.5, { emissive: 0xff2222, emissiveIntensity: 2.0 });
  const BY = 0.075;   // 機体中心の高さ
  const MD = 0.106;   // モーター位置 (x,z 各成分) -> 対角 ~0.30m

  // --- 本体 (丸みのある外観: 潰した球 + ボックス) ---
  const hull = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 16), mShell);
  hull.scale.set(0.105, 0.045, 0.15); hull.position.y = BY; g.add(hull);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), mDark);
  canopy.scale.set(0.06, 0.03, 0.08); canopy.position.set(0, BY + 0.025, 0.01); g.add(canopy);
  const batt = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.022, 0.095), mDark);
  batt.position.y = BY - 0.03; g.add(batt);

  // --- アーム (X配置) とモーター ---
  const motorPos = [[1, -1], [-1, -1], [1, 1], [-1, 1]];   // FR, FL, BR, BL
  const spinDir = [1, -1, -1, 1];                           // 隣り合うプロペラは逆回転 (+1=上から見て反時計回り)
  const armLen = Math.hypot(MD, MD);
  const armGeo = new THREE.BoxGeometry(armLen, 0.012, 0.018);
  const canGeo = new THREE.CylinderGeometry(0.017, 0.019, 0.024, 20);
  const bladeGeo = new THREE.BoxGeometry(0.15, 0.003, 0.015);
  const hubGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.008, 12);
  const discGeo = new THREE.CircleGeometry(0.076, 32); discGeo.rotateX(-Math.PI / 2);
  // プロペラのマテリアルは4基で共有 (回転数に応じて ブレード→半透明ディスク へクロスフェード)
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, metalness: 0.2, roughness: 0.6, transparent: true, opacity: 1 });
  const discMat = new THREE.MeshBasicMaterial({ color: 0xcfd6de, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  const ledGeo = new THREE.SphereGeometry(0.0065, 10, 8);
  const props = [];
  for (let i = 0; i < 4; i++) {
    const sx = motorPos[i][0], sz = motorPos[i][1];
    const mx = sx * MD, mz = sz * MD;
    const arm = new THREE.Mesh(armGeo, mArm);
    arm.position.set(mx / 2, BY, mz / 2);
    arm.rotation.y = Math.atan2(-mz, mx);          // +X を (mx,mz) 方向へ
    g.add(arm);
    const can = new THREE.Mesh(canGeo, mMotor); can.position.set(mx, BY + 0.012, mz); g.add(can);
    // プロペラ
    const pivot = new THREE.Group(); pivot.position.set(mx, BY + 0.03, mz); g.add(pivot);
    const blades = new THREE.Group(); pivot.add(blades);
    const blade = new THREE.Mesh(bladeGeo, bladeMat); blade.rotation.x = 0.22 * spinDir[i]; blades.add(blade);  // ピッチ角
    blades.add(new THREE.Mesh(hubGeo, mMotor));
    const disc = new THREE.Mesh(discGeo, discMat); pivot.add(disc);
    props.push({ pivot, blades, disc, dir: spinDir[i], angle: Math.random() * 6.28, sx, sz });
    // LED: 前=緑 / 後=赤 (モーター外側)
    const led = new THREE.Mesh(ledGeo, sz < 0 ? mLedF : mLedR);
    led.position.set(mx * 1.12, BY - 0.004, mz * 1.12); g.add(led);
  }

  // --- ランディングスキッド ---
  const skidGeo = new THREE.CylinderGeometry(0.0045, 0.0045, 0.16, 8); skidGeo.rotateX(Math.PI / 2);
  const legGeo = new THREE.BoxGeometry(0.006, 0.05, 0.008);
  for (const sx of [-1, 1]) {
    const skid = new THREE.Mesh(skidGeo, mSkid); skid.position.set(sx * 0.075, 0.0045, 0); g.add(skid);
    for (const sz of [-1, 1]) {
      const leg = new THREE.Mesh(legGeo, mSkid);
      leg.position.set(sx * 0.072, 0.03, sz * 0.06); leg.rotation.z = -sx * 0.18; g.add(leg);
    }
  }

  // --- 前方カメラジンバル ---
  const gimbal = new THREE.Group(); gimbal.position.set(0, BY - 0.012, -0.072); g.add(gimbal);
  const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.03, 0.03), mDark); gimbal.add(camBody);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.012, 0.014, 16), mLens);
  lens.rotation.x = Math.PI / 2; lens.position.z = -0.02; gimbal.add(lens);
  const yoke = new THREE.Mesh(new THREE.BoxGeometry(0.044, 0.006, 0.012), mMotor); yoke.position.set(0, 0.018, 0.004); gimbal.add(yoke);

  g.userData = { props, bladeMat, discMat, gimbal, ledRear: mLedR, ledFront: mLedF };
  return g;
}

/** 丸いぼかし影テクスチャ */
function createBlobTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.4)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* =====================================================================
 * 4. 状態 / 一時オブジェクト (ホットループで再利用)
 * ===================================================================== */
const MODE_AUTO = 0, MODE_MANUAL = 1;
const ST_LANDED = 0, ST_TAKEOFF = 1, ST_FLYING = 2, ST_LANDING = 3;
const MODE_NAMES = ['自動', '手動'];
const STATE_NAMES = ['待機中', '離陸中', '飛行中', '着陸中'];

const Y_AXIS = new THREE.Vector3(0, 1, 0), X_AXIS = new THREE.Vector3(1, 0, 0), Z_AXIS = new THREE.Vector3(0, 0, 1);
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3();
const tmpQ = new THREE.Quaternion(), qYaw = new THREE.Quaternion(), qPitch = new THREE.Quaternion(), qRoll = new THREE.Quaternion();
const tmpM = new THREE.Matrix4();

// ドローンの物理状態
const pos = new THREE.Vector3(), vel = new THREE.Vector3(), quat = new THREE.Quaternion();
const sim = {
  mode: MODE_AUTO, state: ST_LANDED, t: 0,
  yaw: 0, yawRate: 0, pitch: 0, roll: 0, thrust: 0, thrustCmd: 0, spool: 0,
  groundY: 0, takeY: 0,
  rpm: new Float32Array(4),
  holdXZ: false, holdY: false,
  hudOn: true,
};
const tgt = new THREE.Vector3();     // 位置ホールド目標
const vCmd = new THREE.Vector3();    // 速度指令 (ワールド)
let yawCmd = 0;                      // ヨーレート指令
let pitchCmd = 0, rollCmd = 0;       // 姿勢指令

// PID群: ホールド(位置→加速度) と 速度モード(速度誤差→加速度)
const pidPx = new PID(3.0, 0.6, 2.8, 2.0), pidPz = new PID(3.0, 0.6, 2.8, 2.0), pidPy = new PID(8.0, 4.0, 5.0, 0.8);
const pidVx = new PID(3.5, 1.2, 0, 1.5), pidVz = new PID(3.5, 1.2, 0, 1.5), pidVy = new PID(5.0, 3.0, 0, 0.8);

// 入力 (スティックは整形済み)
const input = { lx: 0, ly: 0, rx: 0, ry: 0, recall: false, hasController: false };
const prevBtn = { A: false, B: false, X: false, L: false };

// ユーザーの頭
const head = { pos: new THREE.Vector3(0, 1.6, 0), fwd: new THREE.Vector3(0, 0, -1), fwdH: new THREE.Vector3(0, 0, -1), quat: new THREE.Quaternion(), valid: false };

// AUTO用
const auto = { wp: new THREE.Vector3(), phase: 0 /*0=移動 1=ホバー*/, until: 0, look: false, speed: 0, pickT: 0, deadline: 0 };

/* =====================================================================
 * 5. 部屋 (平面検出 / フォールバック)
 * ===================================================================== */
const planes = [];                 // {xr,m,inv,n,horiz,y,minX,maxX,minZ,maxZ,lastChanged,seen,poly,label}
const planeMap = new Map();
const room = { min: new THREE.Vector3(-1.5, 0, -1.5), max: new THREE.Vector3(1.5, 2, 1.5), floorY: 0, fromPlanes: false };
const startCenter = new THREE.Vector3();
let planeFeature = false, roomTimer = 0, planesRev = 0;   // planesRev: 平面の追加/削除/形状変更のたびに+1 (部屋モデルの再構築判定用)

function makePlane(xp) {
  return { xr: xp, m: new THREE.Matrix4(), inv: new THREE.Matrix4(), n: new THREE.Vector3(0, 1, 0), horiz: true, y: 0,
    minX: -0.5, maxX: 0.5, minZ: -0.5, maxZ: 0.5, lastChanged: -1, seen: true, valid: false, side: 0, poly: null, label: '', bm: new Float32Array(16) };   // bm: 部屋モデルを最後に作った時の姿勢
}

function setFallbackRoom() {
  room.fromPlanes = false; room.floorY = 0;
  room.min.set(startCenter.x - C.BOX_X / 2, 0, startCenter.z - C.BOX_Z / 2);
  room.max.set(startCenter.x + C.BOX_X / 2, C.BOX_Y, startCenter.z + C.BOX_Z / 2);
}

/** frame.detectedPlanes からリストを更新 */
function updatePlanes(frame, refSpace) {
  const dp = frame.detectedPlanes;
  if (!dp) return;
  planeFeature = true;
  for (let i = 0; i < planes.length; i++) planes[i].seen = false;
  let changed = false;
  for (const xp of dp) {
    let pl = planeMap.get(xp);
    if (!pl) { pl = makePlane(xp); planeMap.set(xp, pl); planes.push(pl); changed = true; }
    pl.seen = true;
    const pose = frame.getPose(xp.planeSpace, refSpace);
    if (!pose) continue;
    if (pl.lastChanged !== xp.lastChangedTime) {
      pl.lastChanged = xp.lastChangedTime; changed = true;
      const poly = xp.polygon;
      let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
      for (let k = 0; k < poly.length; k++) { const p = poly[k]; if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.z < z0) z0 = p.z; if (p.z > z1) z1 = p.z; }
      if (poly.length) { pl.minX = x0; pl.maxX = x1; pl.minZ = z0; pl.maxZ = z1; }
      pl.label = xp.semanticLabel || '';                                // 'floor' 'wall' 'ceiling' 'table' ... (Quest) / 無ければ ''
      const pn = poly.length, pp = new Float32Array(pn * 2);            // 部屋モデル用に局所XZを保持 (平面更新時のみ確保)
      for (let k = 0; k < pn; k++) { pp[k * 2] = poly[k].x; pp[k * 2 + 1] = poly[k].z; }
      pl.poly = pp;
    }
    pl.m.fromArray(pose.transform.matrix);
    pl.inv.copy(pl.m).invert();
    pl.n.setFromMatrixColumn(pl.m, 1).normalize();
    pl.horiz = Math.abs(pl.n.y) > 0.9;
    pl.y = pl.m.elements[13];
    if (!pl.valid) { pl.valid = true; changed = true; }
    // 壁: ユーザー(頭)がいる側を「部屋側」とする (+1=法線側 / -1=裏側)
    if (!pl.horiz && head.valid) { toLocal(pl, head.pos.x, head.pos.y, head.pos.z); if (Math.abs(_ly) > 0.05) pl.side = _ly > 0 ? 1 : -1; }
  }
  for (let i = planes.length - 1; i >= 0; i--) {
    if (!planes[i].seen) { planeMap.delete(planes[i].xr); planes.splice(i, 1); changed = true; }
  }
  if (changed) { roomTimer = 0; planesRev++; }
}

/** 平面群から床高さ・天井・AABBを再計算 */
function recomputeRoom() {
  if (planes.length < 2) { setFallbackRoom(); return; }
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, fy = 1e9, cy = -1e9;
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    if (!pl.valid) continue;
    for (let k = 0; k < 4; k++) {
      tmpV.set((k & 1) ? pl.maxX : pl.minX, 0, (k & 2) ? pl.maxZ : pl.minZ).applyMatrix4(pl.m);
      if (tmpV.x < x0) x0 = tmpV.x; if (tmpV.x > x1) x1 = tmpV.x;
      if (tmpV.z < z0) z0 = tmpV.z; if (tmpV.z > z1) z1 = tmpV.z;
    }
    if (pl.horiz) { if (pl.y < 0.5 && pl.y > -0.6 && pl.y < fy) fy = pl.y; if (pl.y > 1.8 && pl.y > cy) cy = pl.y; }
  }
  if (x1 - x0 < 1.5 || z1 - z0 < 1.5) { setFallbackRoom(); return; }   // 情報不足
  room.fromPlanes = true;
  room.floorY = fy < 1e8 ? fy : 0;
  room.min.set(x0, room.floorY, z0);
  room.max.set(x1, cy > -1e8 ? cy : room.floorY + 2.4, z1);
}

/** 平面pに対する (x,y,z) の局所座標を _lx,_ly,_lz に格納 */
let _lx = 0, _ly = 0, _lz = 0;
function toLocal(pl, x, y, z) { tmpV3.set(x, y, z).applyMatrix4(pl.inv); _lx = tmpV3.x; _ly = tmpV3.y; _lz = tmpV3.z; }
function inRect(pl, m) { return _lx >= pl.minX - m && _lx <= pl.maxX + m && _lz >= pl.minZ - m && _lz <= pl.maxZ + m; }

/** 点の真下にある最も高い水平面(床/テーブル)の高さ */
function surfaceHeightAt(x, y, z) {
  let best = room.floorY;
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    if (!pl.valid || !pl.horiz || pl.y > y + 0.03 || pl.y <= best) continue;
    toLocal(pl, x, pl.y, z);
    if (inRect(pl, 0)) best = pl.y;
  }
  return best;
}

/** 点から最も近い平面までの距離 (法線方向の符号付き法線も返す: outN) */
function surfaceClearance(p, outN) {
  let best = 1e9;
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    if (!pl.valid) continue;
    toLocal(pl, p.x, p.y, p.z);
    const dx = Math.max(pl.minX - _lx, 0, _lx - pl.maxX), dz = Math.max(pl.minZ - _lz, 0, _lz - pl.maxZ);
    const d = Math.hypot(_ly, dx, dz);
    if (d < best) { best = d; if (outN) outN.copy(pl.n).multiplyScalar(_ly >= 0 ? 1 : -1); }
  }
  // 部屋の箱 (平面が無い/補助) との距離
  const bx = Math.min(p.x - room.min.x, room.max.x - p.x), bz = Math.min(p.z - room.min.z, room.max.z - p.z);
  const bb = Math.min(bx, bz, room.max.y - p.y);
  if (bb < best) {
    best = bb;
    if (outN) {
      if (bb === bx) outN.set(p.x - room.min.x < room.max.x - p.x ? 1 : -1, 0, 0);
      else if (bb === bz) outN.set(0, 0, p.z - room.min.z < room.max.z - p.z ? 1 : -1);
      else outN.set(0, -1, 0);
    }
  }
  return best;
}

/** 点が壁平面の裏側(部屋の外)または壁に近すぎるか */
function behindWall(p) {
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    if (!pl.valid || pl.horiz || pl.side === 0) continue;
    toLocal(pl, p.x, p.y, p.z);
    if (inRect(pl, 0) && _ly * pl.side < C.SURF_CLEAR) return true;
  }
  return false;
}

/* =====================================================================
 * 6. 指令生成 (AUTO / MANUAL / 離着陸 / 呼び戻し)
 * ===================================================================== */
function pickWaypoint() {
  const inX = Math.min(0.5, (room.max.x - room.min.x) / 4), inZ = Math.min(0.5, (room.max.z - room.min.z) / 4);
  const y0 = room.floorY + 0.6, y1 = Math.max(y0 + 0.2, Math.min(room.max.y - 0.4, room.floorY + 1.9));
  let ok = false;
  for (let i = 0; i < 40 && !ok; i++) {
    tmpV2.set(rand(room.min.x + inX, room.max.x - inX), rand(y0, y1), rand(room.min.z + inZ, room.max.z - inZ));
    if (tmpV2.distanceTo(head.pos) < 0.8) continue;
    if (tmpV2.distanceTo(pos) < 0.5) continue;
    if (surfaceClearance(tmpV2, null) < C.SURF_CLEAR + 0.05) continue;
    if (behindWall(tmpV2)) continue;
    ok = true;
  }
  if (!ok) {                                               // 候補なし: 部屋中央 (頭に近ければ頭の前方1mへずらす)
    tmpV2.set((room.min.x + room.max.x) / 2, y0 + 0.4, (room.min.z + room.max.z) / 2);
    if (tmpV2.distanceTo(head.pos) < 1.0) { tmpV2.x = head.pos.x + head.fwdH.x; tmpV2.z = head.pos.z + head.fwdH.z; }
  }
  auto.wp.copy(tmpV2); auto.phase = 0; auto.pickT = sim.t;
  auto.deadline = sim.t + tmpV2.distanceTo(pos) / 0.35 + 4;  // 到達できない(壁/頭に阻まれる)場合の打ち切り
}

function autoCommands(dt) {
  let desYaw = sim.yaw, haveYaw = false;
  if (auto.phase === 1) {                                  // ホバー
    auto.speed += (0 - auto.speed) * (1 - Math.exp(-dt / 0.3));
    if (auto.look) { tmpV.subVectors(head.pos, pos); desYaw = Math.atan2(-tmpV.x, -tmpV.z); haveYaw = true; }
    if (sim.t > auto.until) pickWaypoint();
  } else {
    tmpV.subVectors(auto.wp, pos);
    const dist = tmpV.length();
    if (dist < 0.15 || sim.t > auto.deadline) {
      auto.phase = 1; auto.until = sim.t + rand(1.2, 3.5); auto.look = Math.random() < 0.4;
    } else {
      const target = Math.min(C.AUTO_VMAX, dist * 1.1);
      auto.speed += (target - auto.speed) * (1 - Math.exp(-dt / 0.6));
      tmpV.multiplyScalar(auto.speed / dist);
      tmpV.y = clamp(tmpV.y, -C.AUTO_VY_MAX, C.AUTO_VY_MAX);
      vCmd.copy(tmpV);
      if (tmpV.x * tmpV.x + tmpV.z * tmpV.z > 0.04) { desYaw = Math.atan2(-tmpV.x, -tmpV.z); haveYaw = true; }
    }
  }
  // 反発: 頭と面から離れる
  tmpV.subVectors(pos, head.pos);
  const hd = tmpV.length();
  if (hd < C.HEAD_CLEAR && hd > 1e-4) {
    const k = (C.HEAD_CLEAR - hd) * C.HEAD_GAIN / hd;
    vCmd.addScaledVector(tmpV, k);
    vCmd.x += -tmpV.z * k * 0.5; vCmd.z += tmpV.x * k * 0.5;   // 接線成分: 頭の正面で釣り合って止まらず回り込む
  }
  const sc = surfaceClearance(pos, tmpV2);
  if (sc < C.SURF_CLEAR && sc > 0) vCmd.addScaledVector(tmpV2, (C.SURF_CLEAR - sc) * 3);
  const hv = Math.hypot(vCmd.x, vCmd.z), hvMax = C.AUTO_VMAX * 1.5;
  if (hv > hvMax) { vCmd.x *= hvMax / hv; vCmd.z *= hvMax / hv; }
  vCmd.y = clamp(vCmd.y, -C.AUTO_VY_MAX * 1.5, C.AUTO_VY_MAX * 1.5);
  if (haveYaw) yawCmd = clamp(angleDiff(desYaw, sim.yaw) * 2.5, -1.6, 1.6);
}

function manualCommands() {
  const s = Math.sin(sim.yaw), c = Math.cos(sim.yaw);
  const vf = input.ry * C.MAN_V, vr = input.rx * C.MAN_V;
  vCmd.set(-s * vf + c * vr, input.ly * C.MAN_VY, -c * vf - s * vr);
  yawCmd = -input.lx * C.MAN_YAW;
}

function computeCommands(dt) {
  vCmd.set(0, 0, 0); yawCmd = 0;
  if (sim.state === ST_TAKEOFF) { vCmd.y = clamp((sim.takeY - pos.y) * 1.6, 0.2, 0.8); return; }
  if (sim.state === ST_LANDING) { vCmd.y = -clamp(0.12 + (pos.y - sim.groundY) * 0.8, 0.12, 0.45); return; }
  if (input.recall) {                                      // 頭の正面1mへ戻る
    tmpV.copy(head.pos).addScaledVector(head.fwdH, C.RECALL_DIST);
    tmpV.y = Math.max(head.pos.y - 0.15, room.floorY + 0.5);
    tmpV.sub(pos).multiplyScalar(1.2);
    const l = tmpV.length(); if (l > C.RECALL_VMAX) tmpV.multiplyScalar(C.RECALL_VMAX / l);
    vCmd.copy(tmpV);
    tmpV2.subVectors(head.pos, pos);
    yawCmd = clamp(angleDiff(Math.atan2(-tmpV2.x, -tmpV2.z), sim.yaw) * 2.5, -1.6, 1.6);
    return;
  }
  if (sim.mode === MODE_MANUAL) manualCommands(); else autoCommands(dt);
}

/* =====================================================================
 * 7. 制御 (PID → 推力ベクトル → 姿勢指令)
 * ===================================================================== */
const aDes = new THREE.Vector3();
function control(dt) {
  // 水平
  if (vCmd.x * vCmd.x + vCmd.z * vCmd.z > 0.0004) {
    sim.holdXZ = false;
    aDes.x = pidVx.step(vCmd.x - vel.x, 0, dt); aDes.z = pidVz.step(vCmd.z - vel.z, 0, dt);
  } else {
    if (!sim.holdXZ) { sim.holdXZ = true; tgt.x = pos.x + vel.x * 0.35; tgt.z = pos.z + vel.z * 0.35; pidPx.reset(); pidPz.reset(); }
    aDes.x = pidPx.step(tgt.x - pos.x, -vel.x, dt); aDes.z = pidPz.step(tgt.z - pos.z, -vel.z, dt);
  }
  // 鉛直
  if (Math.abs(vCmd.y) > 0.02) {
    sim.holdY = false; aDes.y = pidVy.step(vCmd.y - vel.y, 0, dt);
  } else {
    if (!sim.holdY) { sim.holdY = true; tgt.y = pos.y + vel.y * 0.35; pidPy.reset(); }
    aDes.y = pidPy.step(tgt.y - pos.y, -vel.y, dt);
  }
  // 推力ベクトル (加速度単位) = 重力補償 + 要求加速度。傾きは最大30度に制限
  let ty = Math.max(C.G + aDes.y, 0.3 * C.G);
  const hm = Math.hypot(aDes.x, aDes.z), maxH = ty * Math.tan(C.MAX_TILT);
  let ax = aDes.x, az = aDes.z;
  if (hm > maxH) { ax *= maxH / hm; az *= maxH / hm; }
  const T = clamp(Math.hypot(ax, ty, az), 0, 2.0 * C.G);
  // ヨー座標系: 前 f=(-sinψ,0,-cosψ), 右 r=(cosψ,0,-sinψ)
  const s = Math.sin(sim.yaw), c = Math.cos(sim.yaw);
  const ur = (ax * c - az * s) / T;         // 右成分
  const uf = (-ax * s - az * c) / T;        // 前成分
  const uy = ty / T;
  rollCmd = Math.asin(clamp(ur, -1, 1));    // 右へ加速 → 右ロール(+)
  pitchCmd = Math.atan2(uf, uy);            // 前へ加速 → 機首下げ(+)
  sim.thrustCmd = T;
}

/** yaw / pitch(機首下げ+) / roll(右傾き+) からクォータニオン: Ry(yaw)*Rx(-pitch)*Rz(-roll) */
function buildQuat(out, yaw, pitch, roll) {
  qYaw.setFromAxisAngle(Y_AXIS, yaw);
  qPitch.setFromAxisAngle(X_AXIS, -pitch);
  qRoll.setFromAxisAngle(Z_AXIS, -roll);
  return out.copy(qYaw).multiply(qPitch).multiply(qRoll);
}

const wob = (t, p) => 0.6 * Math.sin(1.7 * t + p) + 0.4 * Math.sin(2.9 * t + 2.1 * p + 1.0);

function integrate(dt) {
  const aA = 1 - Math.exp(-dt / C.LAG_ATT);
  sim.pitch += (pitchCmd - sim.pitch) * aA;
  sim.roll += (rollCmd - sim.roll) * aA;
  sim.yawRate += (yawCmd - sim.yawRate) * (1 - Math.exp(-dt / C.LAG_YAW));
  sim.yaw += sim.yawRate * dt;
  if (sim.yaw > Math.PI) sim.yaw -= Math.PI * 2; else if (sim.yaw < -Math.PI) sim.yaw += Math.PI * 2;
  sim.thrust += (sim.thrustCmd - sim.thrust) * (1 - Math.exp(-dt / C.LAG_THRUST));
  // アイドル揺れ (姿勢)
  const wa = 0.012;
  buildQuat(quat, sim.yaw, sim.pitch + wa * wob(sim.t, 0.3), sim.roll + wa * wob(sim.t, 2.0));
  tmpV.set(0, 1, 0).applyQuaternion(quat);                 // 機体の上方向
  const sp = vel.length(), drag = C.DRAG_LIN + C.DRAG_QUAD * sp;
  vel.x += (tmpV.x * sim.thrust - drag * vel.x) * dt;
  vel.y += (tmpV.y * sim.thrust - C.G - drag * vel.y) * dt;
  vel.z += (tmpV.z * sim.thrust - drag * vel.z) * dt;
  pos.addScaledVector(vel, dt);
}

/* =====================================================================
 * 8. 衝突 (球 r=0.2 vs 平面 / 部屋のAABB / 地面)
 * ===================================================================== */
function collide() {
  const R = C.RADIUS, e = C.RESTITUTION;
  // 平面
  for (let i = 0; i < planes.length; i++) {
    const pl = planes[i];
    if (!pl.valid) continue;
    if (pl.horiz) {                                         // 水平面: 下側(天井/天板の裏)のみ。上側は地面扱い
      if (pl.y > pos.y && pos.y + C.CEIL_CLEAR > pl.y) {
        toLocal(pl, pos.x, pl.y, pos.z);
        if (inRect(pl, 0)) { pos.y = pl.y - C.CEIL_CLEAR; if (vel.y > 0) vel.y *= -e; }
      }
      continue;
    }
    toLocal(pl, pos.x, pos.y + C.BODY_CENTER, pos.z);
    if (!inRect(pl, 0)) continue;
    // 部屋側 (頭がある側) へ押し戻す。側が未確定ならドローンが今いる側。
    const sgn = pl.side !== 0 ? pl.side : (_ly >= 0 ? 1 : -1);
    const d = _ly * sgn;                                    // 部屋側を正とする符号付き距離
    if (d < R && d > -C.WALL_RECOVER) {
      if (d < -R) sim.holdXZ = false;                       // 裏側から復帰: ホールド目標を取り直す
      pos.addScaledVector(pl.n, sgn * (R - d));
      const vn = vel.dot(pl.n) * sgn;
      if (vn < 0) vel.addScaledVector(pl.n, -(1 + e) * vn * sgn);
    }
  }
  // 部屋の箱
  const lx = room.min.x + R, hx = room.max.x - R, lz = room.min.z + R, hz = room.max.z - R;
  if (pos.x < lx) { pos.x = lx; if (vel.x < 0) vel.x *= -e; } else if (pos.x > hx) { pos.x = hx; if (vel.x > 0) vel.x *= -e; }
  if (pos.z < lz) { pos.z = lz; if (vel.z < 0) vel.z *= -e; } else if (pos.z > hz) { pos.z = hz; if (vel.z > 0) vel.z *= -e; }
  const top = room.max.y - C.CEIL_CLEAR;
  if (pos.y > top) { pos.y = top; if (vel.y > 0) vel.y *= -e; }
  // 地面 (床/テーブル天板)
  if (pos.y < sim.groundY) {
    pos.y = sim.groundY;
    if (vel.y < -0.5) vel.y *= -e; else if (vel.y < 0) vel.y = 0;
    vel.x *= 0.9; vel.z *= 0.9;
  }
}

/* =====================================================================
 * 9. モーター / ステップ / 状態遷移
 * ===================================================================== */
const SGN_X = [1, -1, 1, -1], SGN_Z = [-1, -1, 1, 1];     // FR FL BR BL
const SPIN = [1, -1, -1, 1];
function updateMotors(dt, thrustLike, pErr, rErr, yErr) {
  const a = 1 - Math.exp(-dt / C.LAG_MOTOR);
  const base = C.RPM_HOVER * Math.sqrt(Math.max(thrustLike, 0) / C.G);
  for (let i = 0; i < 4; i++) {
    // 機首下げ指令→前側減速 / 右ロール指令→右側減速 / ヨー指令→回転方向に応じて増減
    const f = 1 - 0.8 * pErr * (SGN_Z[i] < 0 ? 1 : -1) - 0.8 * rErr * SGN_X[i] + 0.15 * yErr * SPIN[i];
    const target = base * Math.sqrt(Math.max(f, 0.05));
    sim.rpm[i] += (target - sim.rpm[i]) * a;
  }
}

function stepSim(dt) {
  sim.t += dt;
  sim.groundY = surfaceHeightAt(pos.x, pos.y, pos.z);
  const st = sim.state;
  if (st === ST_LANDED || (st === ST_TAKEOFF && sim.spool < 1)) {
    // 地上: スプールアップ/ダウンのみ
    if (st === ST_LANDED) sim.spool = Math.max(0, sim.spool - dt / C.SPOOL_DOWN);
    else sim.spool = Math.min(1, sim.spool + dt / C.SPOOL_UP);
    collide();                                               // 地上でも壁/部屋の外へはみ出さない
    pos.y = sim.groundY; vel.set(0, 0, 0);
    sim.pitch *= 0.8; sim.roll *= 0.8; sim.yawRate = 0;
    buildQuat(quat, sim.yaw, sim.pitch, sim.roll);
    pidPx.reset(); pidPz.reset(); pidPy.reset(); pidVx.reset(); pidVz.reset(); pidVy.reset();
    sim.holdXZ = false; sim.holdY = false;
    sim.thrust = C.G * 0.75; sim.thrustCmd = sim.thrust;
    updateMotors(dt, C.G * 0.75 * sim.spool * sim.spool, 0, 0, 0);
    return;
  }
  computeCommands(dt);
  control(dt);
  integrate(dt);
  collide();
  if (!(Number.isFinite(pos.x + pos.y + pos.z + vel.x + vel.y + vel.z + sim.yaw + sim.pitch + sim.roll + sim.thrust))) {   // NaN保険
    pos.set((room.min.x + room.max.x) / 2, sim.groundY || 0, (room.min.z + room.max.z) / 2); vel.set(0, 0, 0);
    sim.yaw = sim.pitch = sim.roll = sim.yawRate = 0; sim.thrust = sim.thrustCmd = C.G; sim.state = ST_LANDED;
    return;
  }
  if (st === ST_TAKEOFF && pos.y >= sim.takeY - 0.06) { sim.state = ST_FLYING; sim.holdY = false; }
  else if (st === ST_LANDING && pos.y - sim.groundY < 0.02) { sim.state = ST_LANDED; vel.set(0, 0, 0); }
  updateMotors(dt, sim.thrust, pitchCmd - sim.pitch, rollCmd - sim.roll, yawCmd - sim.yawRate);
}

function toggleFlight() {
  autoTakeoffDone = true;
  if (sim.state === ST_LANDED) {
    sim.state = ST_TAKEOFF; sim.spool = 0;
    sim.takeY = Math.min(sim.groundY + C.TAKEOFF_ALT, room.max.y - 0.3);
    auto.phase = 1; auto.until = sim.t + 1.0; auto.speed = 0;
  } else if (sim.state === ST_LANDING) sim.state = ST_FLYING;
  else sim.state = ST_LANDING;
}
function toggleMode() { sim.mode = sim.mode === MODE_AUTO ? MODE_MANUAL : MODE_AUTO; if (sim.mode === MODE_AUTO) { auto.phase = 1; auto.until = sim.t + 0.3; } }
function toggleHud() { sim.hudOn = !sim.hudOn; }

const hud = { acc: 0, alt: -1, spd: -1, mode: -1, state: -1, noPlane: null, ctrl: null, on: null, leftGrip: null, hudInit: false };

function updateHud(dt) {
  hud.acc += dt;
  if (hud.acc < 1 / C.HUD_HZ) return;
  hud.acc = 0;
  const alt = Math.round((pos.y - sim.groundY) * 100), spd = Math.round(vel.length() * 10);

    const hx = (room.max.x - room.min.x) / 2, hy = (room.max.y - room.min.y) / 2, hz = (room.max.z - room.min.z) / 2;

 *  許容差を超えるまでは作り直さない。量子化(丸め)と違い、境界値付近の揺れで毎回変化扱いになることがない。確保なし。 */

  if (mon.cool > 0) mon.cool -= dt;
  if (!mon.on) return;
  if (mon.check && mon.cool <= 0) { mon.check = false; syncRoomModel(); }   // 部屋の定期更新(≤1Hz)の後だけ判定。再構築は最短 ROOM_REBUILD_MIN 間隔
  mon.acc += dt;
  const period = 1 / C.FPV_HZ;
  if (mon.acc < period) return;
  mon.acc = Math.min(mon.acc - period, period);
  renderMonitor();
}
function setMonitor(on) {
  if (on === mon.on) return;
  mon.on = on; monMesh.visible = on; mon.acc = 1;            // ON直後は次フレームですぐ描く
  if (on) { mon.check = false; syncRoomModel(); }
}
function toggleMonitor() { setMonitor(!mon.on); }
function resetMonitor() {                                    // セッション終了/開始時: OFF + 部屋モデルを破棄
  mon.on = false; mon.acc = 0; mon.built = false; mon.check = false; mon.cool = 0; monMesh.visible = false; userMark.visible = false;
  setModelGeo(roomFill, [], []); setModelGeo(roomLines, [], []);
}

/* =====================================================================
 * 13. サウンド (Web Audio, 手続き生成)
 * ===================================================================== */
const audio = { ctx: null, oscs: [], mults: [1, 1.012, 2.003], master: null, bp: null, noiseGain: null, panner: null, t: 0 };

function initAudio() {
  if (audio.ctx) { try { audio.ctx.resume(); } catch (e) { /* ignore */ } return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC(); audio.ctx = ctx;
    const master = ctx.createGain(); master.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const panner = ctx.createPanner();
    panner.panningModel = 'HRTF'; panner.distanceModel = 'inverse'; panner.refDistance = 0.5; panner.rolloffFactor = 1.5; panner.maxDistance = 30;
    const sum = ctx.createGain(); sum.gain.value = 0.35;
    const lv = [0.5, 0.4, 0.18];
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 200;
      const g = ctx.createGain(); g.gain.value = lv[i];
      o.connect(g); g.connect(sum); o.start(); audio.oscs.push(o);
    }
    sum.connect(lp); lp.connect(master);
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.8;
    const ng = ctx.createGain(); ng.gain.value = 0;
    ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start();
    master.connect(panner); panner.connect(ctx.destination);
    audio.master = master; audio.bp = bp; audio.noiseGain = ng; audio.panner = panner;
    ctx.resume();
  } catch (e) { audio.ctx = null; audio.oscs.length = 0; }
}

function stopAudio() {
  const ctx = audio.ctx, master = audio.master;
  audio.ctx = null; audio.oscs.length = 0; audio.master = null;
  if (!ctx) return;
  try {                                                     // クリックノイズ防止: フェードアウトしてから閉じる
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 0.12);
  } catch (e) { /* ignore */ }
  setTimeout(() => { try { ctx.close(); } catch (e) { /* ignore */ } }, 200);
}

function updateAudio(avgRpm, now, lpos, lquat) {
  const ctx = audio.ctx;
  if (!ctx || now - audio.t < 1 / 30) return;
  audio.t = now;
  const t = ctx.currentTime;
  const f = avgRpm / 60 * 2;                                // ブレードパス周波数
  for (let i = 0; i < audio.oscs.length; i++) audio.oscs[i].frequency.setTargetAtTime(Math.max(20, f * audio.mults[i]), t, 0.04);
  const lvl = avgRpm < 150 ? 0 : 0.2 + 0.8 * smoothstep(avgRpm, 300, C.RPM_HOVER * 1.2);
  audio.master.gain.setTargetAtTime(0.4 * lvl, t, 0.08);
  audio.noiseGain.gain.setTargetAtTime(0.6 * lvl, t, 0.08);
  audio.bp.frequency.setTargetAtTime(800 + avgRpm * 0.25, t, 0.08);
  const p = audio.panner;
  if (p.positionX) { p.positionX.value = pos.x; p.positionY.value = pos.y + 0.07; p.positionZ.value = pos.z; }
  else p.setPosition(pos.x, pos.y + 0.07, pos.z);
  const L = ctx.listener;
  tmpV.set(0, 0, -1).applyQuaternion(lquat); tmpV2.set(0, 1, 0).applyQuaternion(lquat);
  if (L.positionX) {
    L.positionX.value = lpos.x; L.positionY.value = lpos.y; L.positionZ.value = lpos.z;
    L.forwardX.value = tmpV.x; L.forwardY.value = tmpV.y; L.forwardZ.value = tmpV.z;
    L.upX.value = tmpV2.x; L.upY.value = tmpV2.y; L.upZ.value = tmpV2.z;
  } else { L.setPosition(lpos.x, lpos.y, lpos.z); L.setOrientation(tmpV.x, tmpV.y, tmpV.z, tmpV2.x, tmpV2.y, tmpV2.z); }
}

/* =====================================================================
 * 14. 入力 (XRコントローラー / キーボード)
 * ===================================================================== */
function shape(v) {
  const a = Math.abs(v);
  if (a < C.DEADZONE) return 0;
  const s = (a - C.DEADZONE) / (1 - C.DEADZONE), o = (1 - C.EXPO) * s + C.EXPO * s * s * s;
  return v < 0 ? -o : o;
}
function edge(name, pressed) { const was = prevBtn[name]; prevBtn[name] = pressed; return pressed && !was; }

/** xr-standard: axes[2],[3]=サムスティック、buttons[0]=トリガー、[4]=A/X、[5]=B/Y。前倒し=axes[3]が負 */
function readXRInputs(session) {
  let gotL = false, gotR = false;
  const srcs = session.inputSources;
  input.lx = input.ly = input.rx = input.ry = 0; input.recall = false;
  for (let i = 0; i < srcs.length; i++) {
    const s = srcs[i], gp = s.gamepad;
    if (!gp || s.hand) continue;                             // ハンドトラッキング (Questは手にもgamepadが付く) は対象外
    const ax = gp.axes, b = gp.buttons;
    const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0), sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);
    if (s.handedness === 'left') {
      gotL = true; input.lx = shape(sx); input.ly = shape(-sy);   // 上=上昇, 右=右旋回
      if (edge('X', !!(b[4] && b[4].pressed))) toggleHud();
      if (edge('L', !!(b[0] && b[0].pressed))) toggleMonitor();   // 左トリガー = ドローン視点モニター
    } else if (s.handedness === 'right') {
      gotR = true; input.rx = shape(sx); input.ry = shape(-sy);   // 前=前進, 右=右移動
      if (edge('A', !!(b[4] && b[4].pressed))) toggleMode();
      if (edge('B', !!(b[5] && b[5].pressed))) toggleFlight();
      input.recall = !!(b[0] && b[0].pressed);
    }
  }
  if (!gotL) { prevBtn.X = false; prevBtn.L = false; }
  if (!gotR) { prevBtn.A = false; prevBtn.B = false; }
  input.hasController = gotL || gotR;
}

const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (renderer.xr.isPresenting) return;
  if (e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'KeyM') toggleMode();
  else if (e.code === 'KeyT') toggleFlight();
  else if (e.code === 'KeyH') toggleHud();
  else if (e.code === 'KeyV') toggleMonitor();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
function readKeyboard() {
  const k = (c) => (keys.has(c) ? 1 : 0);
  input.lx = k('ArrowRight') - k('ArrowLeft'); input.ly = k('ArrowUp') - k('ArrowDown');
  input.rx = k('KeyD') - k('KeyA'); input.ry = k('KeyW') - k('KeyS');
  input.recall = keys.has('KeyR'); input.hasController = true;
}

// デスクトップ用の簡易マウスオービット
const orbit = { th: 0, ph: 0.25, r: 3.2, tx: 0, ty: 0.9, tz: -1, drag: false, x: 0, y: 0 };
renderer.domElement.addEventListener('pointerdown', (e) => { orbit.drag = true; orbit.x = e.clientX; orbit.y = e.clientY; });
window.addEventListener('pointerup', () => { orbit.drag = false; });
window.addEventListener('pointermove', (e) => {
  if (!orbit.drag) return;
  orbit.th -= (e.clientX - orbit.x) * 0.006; orbit.ph = clamp(orbit.ph + (e.clientY - orbit.y) * 0.006, -0.2, 1.4);
  orbit.x = e.clientX; orbit.y = e.clientY;
});
renderer.domElement.addEventListener('wheel', (e) => { orbit.r = clamp(orbit.r * (1 + Math.sign(e.deltaY) * 0.08), 0.8, 8); e.preventDefault(); }, { passive: false });
function updateOrbit() {
  const cp = Math.cos(orbit.ph);
  camera.position.set(orbit.tx + orbit.r * cp * Math.sin(orbit.th), orbit.ty + orbit.r * Math.sin(orbit.ph), orbit.tz + orbit.r * cp * Math.cos(orbit.th));
  camera.lookAt(orbit.tx, orbit.ty, orbit.tz);
}

/* =====================================================================
 * 15. メインループ
 * ===================================================================== */
let xrSession = null, placed = false, lastT = 0, noCtrlT = 0, autoTakeoffDone = false;

function updateHeadXR(frame, ref) {
  const vp = frame.getViewerPose(ref);
  if (!vp) return;
  const t = vp.transform, o = t.orientation;
  head.pos.set(t.position.x, t.position.y, t.position.z);
  head.quat.set(o.x, o.y, o.z, o.w);
  head.fwd.set(0, 0, -1).applyQuaternion(head.quat);
  head.fwdH.set(head.fwd.x, 0, head.fwd.z);
  if (head.fwdH.lengthSq() > 1e-4) head.fwdH.normalize(); else head.fwdH.set(0, 0, -1);
  head.valid = true;
}

function placeDroneInitial() {
  startCenter.set(head.pos.x, 0, head.pos.z);
  setFallbackRoom();
  if (renderer.xr.isPresenting) pos.set(head.pos.x + head.fwdH.x, 0, head.pos.z + head.fwdH.z);
  else pos.set(0, 0, -1);
  tmpV.subVectors(head.pos, pos); sim.yaw = Math.atan2(-tmpV.x, -tmpV.z);
  vel.set(0, 0, 0); sim.state = ST_LANDED; sim.spool = 0; sim.rpm.fill(0);
  buildQuat(quat, sim.yaw, 0, 0);
  placed = true;
}

function frame(time, xrFrame) {
  const now = time * 0.001;
  const dt = clamp(now - lastT, 0, 0.05); lastT = now;
  const xr = renderer.xr.isPresenting;

  // --- 入力・頭位置・平面 ---
  if (xr) {
    if (xrFrame && xrSession) {
      const ref = renderer.xr.getReferenceSpace();
      if (ref) { updateHeadXR(xrFrame, ref); updatePlanes(xrFrame, ref); }
      readXRInputs(xrSession);
    }
  } else {
    readKeyboard(); updateOrbit();
    head.pos.set(0, 1.6, 0); head.quat.identity(); head.fwd.set(0, 0, -1); head.fwdH.set(0, 0, -1); head.valid = true;
  }
  if (!placed && head.valid) placeDroneInitial();
  if (xr && !input.hasController) {
    sim.mode = MODE_AUTO;                                    // ハンドトラッキング時はAUTO固定
    noCtrlT = sim.state === ST_LANDED && !autoTakeoffDone ? noCtrlT + dt : 0;   // 自動離陸はセッション中1回だけ (ピンチで着陸させた後に勝手に再離陸しない)
    if (noCtrlT > C.AUTO_TAKEOFF_DELAY) { noCtrlT = 0; toggleFlight(); }
  } else noCtrlT = 0;
  roomTimer -= dt;
  if (roomTimer <= 0) { roomTimer = C.ROOM_REFRESH; if (xr && planeFeature) recomputeRoom(); else if (!xr || !planeFeature) setFallbackRoom(); mon.check = true; }

  // --- 固定タイムステップ ---
  if (placed) {
    acc += dt;
    let n = 0;
    while (acc >= C.DT && n < C.MAX_STEPS) { stepSim(C.DT); acc -= C.DT; n++; }
    if (n === C.MAX_STEPS) acc = 0;
  }

  // --- 描画反映 ---
  drone.position.copy(pos);
  if (sim.state !== ST_LANDED) {                             // 位置の微小な揺れ
    drone.position.x += 0.004 * wob(sim.t, 0.7); drone.position.y += 0.004 * wob(sim.t, 1.9); drone.position.z += 0.004 * wob(sim.t, 3.1);
  }
  drone.quaternion.copy(quat);
  const props = dUD.props;
  let avg = 0;
  for (let i = 0; i < 4; i++) {
    const p = props[i], rpm = sim.rpm[i]; avg += rpm;
    p.angle += p.dir * Math.min(rpm, C.RPM_VISUAL_MAX) * Math.PI / 30 * dt;
    if (p.angle > 6.2832) p.angle -= 6.2832; else if (p.angle < -6.2832) p.angle += 6.2832;
    p.blades.rotation.y = p.angle;
  }
  avg *= 0.25;
  const blur = smoothstep(avg, 300, 1800);
  dUD.bladeMat.opacity = 1 - 0.85 * blur;
  dUD.bladeMat.depthWrite = blur < 0.05;                     // ぼけ中に深度を書くとディスクがブレード形に欠ける
  dUD.discMat.opacity = 0.22 * blur;
  for (let i = 0; i < 4; i++) props[i].disc.visible = blur > 0.01;
  dUD.gimbal.rotation.x = sim.pitch * 0.85;
  dUD.ledRear.emissiveIntensity = (Math.floor(now * 3) & 1) ? 2.2 : 0.1;

  // ブロブシャドウ
  const h = Math.max(0, pos.y - sim.groundY);
  shadow.visible = h < 2.2;
  shadow.position.set(pos.x, sim.groundY + 0.004, pos.z);
  const ss = 0.34 + h * 0.2; shadow.scale.set(ss, 1, ss);
  shadowMat.opacity = 0.6 * clamp(1 - h / 2.2, 0, 1);
  shadowBias.value = xr && renderer.xr.hasDepthSensing() ? C.SHADOW_DEPTH_BIAS : 0;

  desk.visible = !xr;
  hudMesh.visible = sim.hudOn;
  updateHud(dt); updateHudFloat();
  updateMonitor(dt);                                         // ドローン視点を (30Hz上限で) RTへ描く: メイン描画の前
  if (xr) updateAudio(avg, now, head.pos, head.quat); else updateAudio(avg, now, camera.position, camera.quaternion);
  renderer.render(scene, camera);
}
let acc = 0;

/* =====================================================================
 * 16. セッション管理
 * ===================================================================== */
function resetWorld() {
  placed = false; acc = 0; sim.state = ST_LANDED; sim.mode = MODE_AUTO; sim.spool = 0; sim.rpm.fill(0);
  sim.pitch = sim.roll = sim.yawRate = 0; sim.holdXZ = sim.holdY = false;
  planes.length = 0; planeMap.clear(); planeFeature = false; roomTimer = 0; head.valid = false; hud.hudInit = false;
  auto.phase = 1; auto.until = 0; auto.speed = 0;
  prevBtn.A = prevBtn.B = prevBtn.X = prevBtn.L = false;
  planesRev++;
  resetMonitor();
  autoTakeoffDone = false; noCtrlT = 0;
}

async function startXR() {
  renderer.xr.setReferenceSpaceType('local-floor');
  // 深度オクルージョン: three r170 は 'depth-sensing' が許可されると XRWebGLBinding.getDepthInformation() の
  // GPUテクスチャを自動で深度プリパスに使う (アプリ側の追加コード不要)。XRWebGLBinding が無い環境で許可されると
  // three 内部で例外になるため、その場合は要求しない。形式はUA任せ (空配列=指定なし)。
  const init = { requiredFeatures: ['local-floor'], optionalFeatures: ['plane-detection', 'hand-tracking'] };
  if (typeof XRWebGLBinding !== 'undefined') {
    init.optionalFeatures.push('depth-sensing');
    init.depthSensing = { usagePreference: ['gpu-optimized'], dataFormatPreference: [] };
  }
  const session = await navigator.xr.requestSession('immersive-ar', init);
  xrSession = session;
  resetWorld();
  session.addEventListener('end', onXREnd);
  session.addEventListener('select', (e) => {                // ハンドトラッキングのピンチで離着陸
    const s = e.inputSource;
    if (s && (!s.gamepad || s.hand) && !input.hasController) toggleFlight();
  });
  session.addEventListener('visibilitychange', () => {       // ヘッドセットを外して戻った時などに音を復帰
    if (session.visibilityState === 'visible' && audio.ctx && audio.ctx.state !== 'running') { try { audio.ctx.resume(); } catch (e) { /* ignore */ } }
  });
  try { await renderer.xr.setSession(session); }
  catch (err) { try { await session.end(); } catch (e) { /* ignore */ } throw err; }
  renderer.domElement.style.display = 'block';
  startEl.classList.add('hidden');
  placeHud();
  renderer.setAnimationLoop(frame);
}

function onXREnd() {
  xrSession = null;
  stopAudio();
  renderer.setAnimationLoop(null);
  renderer.domElement.style.display = 'none';
  resetWorld();
  hud.leftGrip = null; placeHud();
  startEl.classList.remove('hidden');
  btn.disabled = false;
  msgEl.textContent = 'セッションを終了しました。';
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  if (renderer.xr.isPresenting) return;                      // XR中はthreeがサイズを管理 (setSizeは警告になる)
  renderer.setSize(window.innerWidth, window.innerHeight);
  placeHud();
});

// デバッグ用ハンドル (?debug 付きURLのみ)。テストから内部状態と XR 向け関数を直接叩く。
if (new URLSearchParams(location.search).has('debug')) {
  window.__drone = {
    THREE, C, pos, vel, quat, sim, shadowBias, shadowMat, input, head, room, planes, auto, hud, hudMesh, audio, drone, mon, monMesh, monRT, monScene, fpvCam, roomModel, roomFill, roomLines, userMark, MON_LAYER, planeKind, shadow, camera, renderer, scene, orbit, tgt, vCmd, startCenter,
    stepSim, collide, updatePlanes, recomputeRoom, readXRInputs, placeHud, updateHeadXR, pickWaypoint, behindWall, surfaceHeightAt, surfaceClearance,
    toggleFlight, toggleMode, toggleHud, toggleMonitor, setMonitor, renderMonitor, updateFpvCamera, syncRoomModel, rebuildRoomModel, roomModelStale, resetWorld, placeDroneInitial, initAudio, stopAudio, frame,
    get yawCmd() { return yawCmd; }, get xrSession() { return xrSession; }, get placed() { return placed; },
    setLeftGrip(g) { hud.leftGrip = g; },
  };
}

(async function boot() {
  let supported = false;
  try { supported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch (e) { supported = false; }
  if (supported) {
    let starting = false;
    const go = async (silent) => {
      if (starting || renderer.xr.isPresenting) return;
      starting = true; btn.disabled = true; msgEl.textContent = '';
      initAudio();                                            // ユーザー操作内で開始
      try { await startXR(); }
      catch (err) { stopAudio(); btn.disabled = false; if (!silent) msgEl.textContent = 'MRを開始できませんでした: ' + (err && err.message ? err.message : err); }
      starting = false;
    };
    // 開始画面のどこを押しても開始 (ボタンを狙わなくてよい)
    startEl.addEventListener('click', () => go(false));
    // アプリとして起動された場合など、操作なしで開始できる環境ではそのままMRに入る。不可なら黙ってボタン待ち。
    go(true);
  } else {
    // デスクトッププレビュー
    msgEl.textContent = 'この環境は WebXR の immersive-ar（ARモード）に対応していません。PCプレビューで動作確認できます。操作: WASD=前後左右 / 矢印=上下・旋回 / M=自動・手動 / T=離着陸 / R=呼び戻し / H=HUD / V=ドローン視点 / ドラッグ=視点';
    btn.textContent = 'PCプレビューを開始';
    renderer.domElement.style.display = 'block';
    resetWorld(); placeHud();
    renderer.setAnimationLoop(frame);
    btn.addEventListener('click', () => { initAudio(); startEl.classList.add('hidden'); });
  }
})();
